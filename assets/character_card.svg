<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="100%">
  <defs>
    <!-- Dark Cyberpunk Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0b0e14" />
    </linearGradient>

    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="35%" stop-color="#7928ca" />
      <stop offset="70%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#ff007f">
        <animate attributeName="stop-color" values="#ff007f;#00f5d4;#7928ca;#ff007f" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Health Bar Gradient -->
    <linearGradient id="hpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>

    <!-- Mana Bar Gradient -->
    <linearGradient id="mpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- XP Bar Gradient -->
    <linearGradient id="xpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b224ef" />
      <stop offset="100%" stop-color="#7579ff" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Courier New', 'Fira Code', monospace; }
    .title { font-weight: 800; font-size: 16px; fill: #00f5d4; letter-spacing: 2px; }
    .label { font-size: 13px; fill: #8b949e; font-weight: 600; }
    .value { font-size: 13.5px; fill: #f0f6fc; font-weight: bold; }
    .badge-text { font-size: 11px; font-weight: bold; fill: #ffffff; }
    .pulse-dot {
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.4; r: 5; }
      50% { opacity: 1; r: 7; }
      100% { opacity: 0.4; r: 5; }
    }
    .bar-animate {
      animation: fillAnim 2s ease-out forwards;
    }
    @keyframes fillAnim {
      from { width: 0; }
    }
  </style>

  <!-- Outer Card Frame with Glowing Border -->
  <rect x="3" y="3" width="844" height="354" rx="14" fill="url(#cardBg)" stroke="url(#neonBorder)" stroke-width="2" />

  <!-- Window Header / Title Bar -->
  <path d="M 4 18 C 4 9 10 4 18 4 L 832 4 C 840 4 846 9 846 18 L 846 44 L 4 44 Z" fill="#131720" />
  <circle cx="26" cy="24" r="6" fill="#ff5f56" />
  <circle cx="46" cy="24" r="6" fill="#ffbd2e" />
  <circle cx="66" cy="24" r="6" fill="#27c93f" />

  <text x="425" y="29" text-anchor="middle" class="mono title" filter="url(#neonGlow)">⚔️ CHARACTER PROFILE // LVL 22 WARLOCK</text>
  <line x1="4" y1="44" x2="846" y2="44" stroke="#30363d" stroke-width="1" />

  <!-- Avatar / Class Seal Shield (Left Col) -->
  <g transform="translate(30, 65)">
    <!-- Shield Outline -->
    <rect x="0" y="0" width="130" height="150" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
    <path d="M 65 20 Q 110 30 110 85 Q 110 120 65 140 Q 20 120 20 85 Q 20 30 65 20 Z" fill="#1f242c" stroke="#7928ca" stroke-width="2" filter="url(#neonGlow)"/>
    
    <!-- Class Icon: Magic Sword / Wand Symbol -->
    <text x="65" y="80" text-anchor="middle" font-size="34">🧙‍♂️</text>
    <rect x="20" y="105" width="90" height="22" rx="11" fill="#7928ca" />
    <text x="65" y="120" text-anchor="middle" class="mono badge-text">WARLOCK</text>

    <!-- Rank Tag Below Shield -->
    <rect x="10" y="165" width="110" height="24" rx="6" fill="#21262d" stroke="#00f5d4" stroke-width="1" />
    <text x="65" y="181" text-anchor="middle" class="mono" font-size="11" fill="#00f5d4" font-weight="bold">RANK: S-CLASS</text>

    <!-- Quick Status Indicator -->
    <circle cx="25" cy="215" r="6" fill="#27c93f" class="pulse-dot" />
    <text x="40" y="219" class="mono" font-size="11" fill="#27c93f" font-weight="bold">OPEN TO RAID</text>
  </g>

  <!-- Main Stats Fields (Middle & Right Columns) -->
  <g transform="translate(185, 70)">
    
    <!-- Character Info Grid -->
    <text x="0" y="15" class="mono label">CHARACTER NAME</text>
    <text x="160" y="15" class="mono value">Malawige Inusha Thathsara</text>

    <text x="0" y="42" class="mono label">HERO CLASS</text>
    <text x="160" y="42" class="mono value" fill="#ff79c6">Full-Stack Mage &amp; AI Alchemist</text>

    <text x="0" y="69" class="mono label">SPAWN POINT</text>
    <text x="160" y="69" class="mono value">Colombo, Sri Lanka 🇱🇰</text>

    <!-- Divider Line -->
    <line x1="0" y1="88" x2="630" y2="88" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4" />

    <!-- Interactive-style HP / Mana / XP Meter Gauges -->
    <!-- Health / Coffee -->
    <text x="0" y="115" class="mono label">HP (COFFEE TANK)</text>
    <rect x="160" y="102" width="380" height="16" rx="8" fill="#21262d" />
    <rect x="160" y="102" width="365" height="16" rx="8" fill="url(#hpGrad)" class="bar-animate" />
    <text x="555" y="115" class="mono" font-size="12" fill="#ff79c6" font-weight="bold">96 / 100</text>

    <!-- Mana / Curiosity -->
    <text x="0" y="145" class="mono label">MP (CURIOSITY)</text>
    <rect x="160" y="132" width="380" height="16" rx="8" fill="#21262d" />
    <rect x="160" y="132" width="380" height="16" rx="8" fill="url(#mpGrad)" class="bar-animate" />
    <text x="555" y="145" class="mono" font-size="12" fill="#00f5d4" font-weight="bold">MAX (∞)</text>

    <!-- Level / EXP -->
    <text x="0" y="175" class="mono label">EXP PROGRESS</text>
    <rect x="160" y="162" width="380" height="16" rx="8" fill="#21262d" />
    <rect x="160" y="162" width="320" height="16" rx="8" fill="url(#xpGrad)" class="bar-animate" />
    <text x="555" y="175" class="mono" font-size="12" fill="#bd93f9" font-weight="bold">84% to LVL 23</text>

    <!-- Divider Line -->
    <line x1="0" y1="198" x2="630" y2="198" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4" />

    <!-- Traits and Abilities -->
    <g transform="translate(0, 222)">
      <!-- Passive Skill Card -->
      <rect x="0" y="0" width="305" height="42" rx="6" fill="#161b22" stroke="#ffbd2e" stroke-width="1" />
      <text x="12" y="18" class="mono" font-size="11" fill="#ffbd2e" font-weight="bold">⚡ PASSIVE: RAPID PROTOTYPE</text>
      <text x="12" y="32" class="mono" font-size="10" fill="#8b949e">Transmutes ideas to production MVP in &lt; 24h</text>

      <!-- Ultimate Ability Card -->
      <rect x="325" y="0" width="305" height="42" rx="6" fill="#161b22" stroke="#bd93f9" stroke-width="1" />
      <text x="337" y="18" class="mono" font-size="11" fill="#bd93f9" font-weight="bold">🌌 ULTIMATE: MULTIMODAL FUSION</text>
      <text x="337" y="32" class="mono" font-size="10" fill="#8b949e">Unifies Local LLMs, Vision &amp; Real-Time UI</text>
    </g>

  </g>
</svg>
