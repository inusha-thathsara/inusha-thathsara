<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0e131b" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="33%" stop-color="#8b5cf6" />
      <stop offset="66%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Bar Gradients -->
    <!-- 1: Full-Stack (Diamond - Cyan/Blue) -->
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- 2: AI & Vision (Platinum - Violet/Pink) -->
    <linearGradient id="platinumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- 3: Architecture (Gold - Amber/Orange) -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- 4: Hackathons (Grandmaster - Emerald/Teal) -->
    <linearGradient id="grandmasterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Courier New', 'Fira Code', monospace; }
    .skill-title { font-size: 13.5px; fill: #e6edf3; font-weight: 700; }
    .badge-diamond { fill: #06b6d4; font-weight: bold; font-size: 10.5px; }
    .badge-platinum { fill: #d946ef; font-weight: bold; font-size: 10.5px; }
    .badge-gold { fill: #f59e0b; font-weight: bold; font-size: 10.5px; }
    .badge-grandmaster { fill: #10b981; font-weight: bold; font-size: 10.5px; }
    .percent { font-size: 12.5px; fill: #f0f6fc; font-weight: bold; }
    
    .bar-anim {
      animation: expand 1.8s ease-out forwards;
    }
    @keyframes expand {
      from { width: 0; }
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="256" rx="12" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Card Top Header -->
  <path d="M 3 14 C 3 7 8 3 15 3 L 835 3 C 842 3 847 7 847 14 L 847 38 L 3 38 Z" fill="#131720" />
  <circle cx="22" cy="20" r="5" fill="#ff5f56" />
  <circle cx="38" cy="20" r="5" fill="#ffbd2e" />
  <circle cx="54" cy="20" r="5" fill="#27c93f" />
  <text x="425" y="24" text-anchor="middle" class="mono" font-size="12" fill="#8b949e" font-weight="bold" letter-spacing="2">⚔️ COMBAT SKILL TREE &amp; LEVEL PROGRESSION</text>
  <line x1="3" y1="38" x2="847" y2="38" stroke="#30363d" stroke-width="1" />

  <!-- Skill Rows -->
  <g transform="translate(35, 52)">

    <!-- Row 1: Full-Stack Web Engineering -->
    <g transform="translate(0, 0)">
      <text x="0" y="16" class="mono skill-title">🌐 Full-Stack Web Engineering</text>
      <rect x="250" y="4" width="70" height="18" rx="4" fill="#0e3a47" stroke="#06b6d4" stroke-width="0.8" />
      <text x="285" y="17" text-anchor="middle" class="mono badge-diamond">DIAMOND</text>
      
      <!-- Track bar -->
      <rect x="340" y="6" width="370" height="14" rx="7" fill="#21262d" />
      <rect x="340" y="6" width="333" height="14" rx="7" fill="url(#diamondGrad)" class="bar-anim" filter="url(#glow)" />
      <text x="730" y="18" class="mono percent">90%</text>
    </g>

    <!-- Row 2: AI & Computer Vision -->
    <g transform="translate(0, 48)">
      <text x="0" y="16" class="mono skill-title">🧠 AI &amp; Computer Vision</text>
      <rect x="250" y="4" width="70" height="18" rx="4" fill="#38133f" stroke="#d946ef" stroke-width="0.8" />
      <text x="285" y="17" text-anchor="middle" class="mono badge-platinum">PLATINUM</text>
      
      <!-- Track bar -->
      <rect x="340" y="6" width="370" height="14" rx="7" fill="#21262d" />
      <rect x="340" y="6" width="303" height="14" rx="7" fill="url(#platinumGrad)" class="bar-anim" filter="url(#glow)" />
      <text x="730" y="18" class="mono percent">82%</text>
    </g>

    <!-- Row 3: System Architecture -->
    <g transform="translate(0, 96)">
      <text x="0" y="16" class="mono skill-title">🏛️ System Architecture</text>
      <rect x="250" y="4" width="70" height="18" rx="4" fill="#3d2c0d" stroke="#f59e0b" stroke-width="0.8" />
      <text x="285" y="17" text-anchor="middle" class="mono badge-gold">GOLD</text>
      
      <!-- Track bar -->
      <rect x="340" y="6" width="370" height="14" rx="7" fill="#21262d" />
      <rect x="340" y="6" width="288" height="14" rx="7" fill="url(#goldGrad)" class="bar-anim" filter="url(#glow)" />
      <text x="730" y="18" class="mono percent">78%</text>
    </g>

    <!-- Row 4: Hackathon Speedrunning -->
    <g transform="translate(0, 144)">
      <text x="0" y="16" class="mono skill-title">⚡ Hackathon Speedrunning</text>
      <rect x="250" y="4" width="70" height="18" rx="4" fill="#0d3b2e" stroke="#10b981" stroke-width="0.8" />
      <text x="285" y="17" text-anchor="middle" class="mono badge-grandmaster">MASTER</text>
      
      <!-- Track bar -->
      <rect x="340" y="6" width="370" height="14" rx="7" fill="#21262d" />
      <rect x="340" y="6" width="366" height="14" rx="7" fill="url(#grandmasterGrad)" class="bar-anim" filter="url(#glow)" />
      <text x="730" y="18" class="mono percent">99%</text>
    </g>

  </g>
</svg>
